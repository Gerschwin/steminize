# Builds desktop installers for Windows, macOS and Linux when you push a tag
# like v1.0.1, and attaches them to a draft GitHub Release. Tags starting v0. (the pre-1.0 betas) are
# flagged as pre-releases; v1.0.0 and later are normal releases.
name: Desktop builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # The GStreamer packages are so the AppImage can bundle the audio decoders (FLAC, WAV, MP3, AAC):
          # without them it can't open a song at all (WebKit decodes audio through GStreamer).
          # libasound2-dev, libclang-dev and libjack-jackd2-dev are for the native audio engine (the audio library, the time-stretch build, and the JACK crate's build-time check; libjack itself is loaded at run time).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libclang-dev libjack-jackd2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: npm ci
      # The in-app updater needs every release's update files signed with the project's own update key (not a code-signing
      # certificate). The private key lives in the repository secret TAURI_SIGNING_PRIVATE_KEY; stop early with a clear message if it is missing.
      - name: Check the update signing key is set
        env: { KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}' }
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is not set. See UPDATER.md."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}'
        with:
          # latest.json (what the in-app updater reads) is attached to each release; Windows updates use the .exe installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: Steminize ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}
