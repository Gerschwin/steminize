[package]
name = "steminize_player"
version = "0.1.0"
edition = "2021"
authors = ["Neil"]
license = "GPL-3.0-or-later"
description = "Plays a Steminize song's stems in your DAW, in time with the DAW's transport"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# The plugin framework. Its VST3 export uses GPLv3 bindings, so this plugin as a whole is GPLv3 (see LICENSE); the app is MIT.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["opengl"] }
arc-swap = "1"
arrayvec = "0.7"
signalsmith-stretch = "0.1.3"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
