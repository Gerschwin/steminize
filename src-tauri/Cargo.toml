[package]
name = "steminize"
version = "0.9.3"
description = "A practice studio for musicians: stem separation, practice tools and tab, all on your own machine"
edition = "2021"
license = "MIT"

[lib]
name = "steminize_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# For the "From YouTube" import: fetches a standalone yt-dlp binary on first use and shells
# out to it (search + audio-only download). No ffmpeg needed since we never re-encode/mux.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt"] }
cpal = "0.15"
signalsmith-stretch = "0.1.3"
claxon = "0.4.3"
fs4 = "1.1.0"

# Linux only: the webview (WebKitGTK) denies microphone access unless the host app allows it.
# Same version Tauri's own webview layer already builds against.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
